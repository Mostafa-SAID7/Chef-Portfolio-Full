<header class="fixed top-0 left-0 right-0 z-50 glass-card-strong border-b border-border">
  <nav class="container mx-auto px-4 py-4">
    <div class="flex items-center justify-between">
      <!-- Logo -->
      <a routerLink="/" class="text-2xl font-bold gradient-text">
        MS
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center gap-8">
        @for (link of navLinks; track link.path) {
          <a 
            [routerLink]="link.path" 
            routerLinkActive="text-accent"
            [routerLinkActiveOptions]="{exact: true}"
            class="nav-link-hover font-semibold text-foreground hover:text-accent transition-colors">
            {{ getLabel(link) }}
          </a>
        }
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-4">
        <!-- Theme Toggle -->
        <button 
          (click)="toggleTheme()"
          class="p-2 rounded-lg hover:bg-muted transition-colors"
          [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
          @if (themeService.isDark()) {
            <!-- Sun Icon -->
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
              </path>
            </svg>
          } @else {
            <!-- Moon Icon -->
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
              </path>
            </svg>
          }
        </button>

        <!-- Language Toggle -->
        <button 
          (click)="toggleLanguage()"
          class="p-2 px-3 rounded-lg hover:bg-muted transition-colors font-bold text-sm">
          {{ languageService.language() === 'en' ? 'AR' : 'EN' }}
        </button>

        <!-- Mobile Menu Button -->
        <button 
          (click)="toggleMobileMenu()"
          class="md:hidden p-2 rounded-lg hover:bg-muted transition-colors"
          aria-label="Toggle menu">
          @if (!mobileMenuOpen()) {
            <!-- Hamburger Icon -->
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          } @else {
            <!-- Close Icon -->
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          }
        </button>
      </div>
    </div>
  </nav>
</header>

<!-- Mobile Menu -->
@if (mobileMenuOpen()) {
  <div class="mobile-menu-overlay md:hidden" (click)="closeMobileMenu()">
    <div class="container mx-auto px-4 py-8">
      <!-- Close Button at Top -->
      <div class="flex justify-end mb-8">
        <button 
          (click)="closeMobileMenu()"
          class="p-3 rounded-lg hover:bg-muted/50 transition-colors"
          aria-label="Close menu">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Navigation Links -->
      <nav class="flex flex-col gap-6" (click)="$event.stopPropagation()">
        @for (link of navLinks; track link.path) {
          <a 
            [routerLink]="link.path" 
            (click)="closeMobileMenu()"
            routerLinkActive="text-accent"
            [routerLinkActiveOptions]="{exact: true}"
            class="text-3xl font-bold hover:text-accent transition-colors">
            {{ getLabel(link) }}
          </a>
        }

        <!-- Theme & Language in Mobile Menu -->
        <div class="flex gap-4 mt-8 pt-8 border-t border-border">
          <button 
            (click)="toggleTheme(); $event.stopPropagation()"
            class="flex items-center gap-2 px-4 py-2 rounded-lg glass-card hover:border-accent transition-all">
            @if (themeService.isDark()) {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                </path>
              </svg>
              <span class="text-sm font-semibold">Light</span>
            } @else {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                </path>
              </svg>
              <span class="text-sm font-semibold">Dark</span>
            }
          </button>

          <button 
            (click)="toggleLanguage(); $event.stopPropagation()"
            class="px-4 py-2 rounded-lg glass-card hover:border-accent transition-all font-bold">
            {{ languageService.language() === 'en' ? 'العربية' : 'English' }}
          </button>
        </div>
      </nav>
    </div>
  </div>
}
